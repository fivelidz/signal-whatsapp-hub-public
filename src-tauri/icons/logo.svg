<?xml version="1.0" encoding="UTF-8"?>
<!--
  Radio Agent Monitor — app logo.
  Concept: a radio mast emitting signal arcs (TX/RX over the air) with a
  transcript/speech card at the base (the agent turns voice into text and back).
  Palette matches the dashboard: bg #0c1014, accent cyan #4cc2ff, green #43d17a.
  This SVG is the source of truth; PNG/ICNS/ICO icons are rendered from it.
-->
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10171f"/>
      <stop offset="1" stop-color="#0a0e13"/>
    </linearGradient>
    <linearGradient id="mast" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fd6ff"/>
      <stop offset="1" stop-color="#3aa6e0"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- rounded background -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="104" fill="none" stroke="#1d2733" stroke-width="4"/>

  <!-- signal arcs (left + right), green = RX/TX over the air -->
  <g fill="none" stroke="#43d17a" stroke-linecap="round" filter="url(#glow)">
    <path d="M196 150 A92 92 0 0 0 196 300" stroke-width="13" opacity="0.95"/>
    <path d="M158 124 A150 150 0 0 0 158 326" stroke-width="11" opacity="0.6"/>
    <path d="M316 150 A92 92 0 0 1 316 300" stroke-width="13" opacity="0.95"/>
    <path d="M354 124 A150 150 0 0 1 354 326" stroke-width="11" opacity="0.6"/>
  </g>

  <!-- transmitter dot at the top of the mast -->
  <circle cx="256" cy="150" r="20" fill="#4cc2ff" filter="url(#glow)"/>

  <!-- the mast -->
  <path d="M256 168 L210 360 L302 360 Z" fill="none" stroke="url(#mast)" stroke-width="14" stroke-linejoin="round"/>
  <line x1="232" y1="262" x2="280" y2="262" stroke="url(#mast)" stroke-width="11" stroke-linecap="round"/>
  <line x1="222" y1="310" x2="290" y2="310" stroke="url(#mast)" stroke-width="11" stroke-linecap="round"/>

  <!-- transcript card at the base: the spoken word turned to text -->
  <g>
    <rect x="150" y="372" width="212" height="86" rx="16" fill="#151c25" stroke="#2a3b4a" stroke-width="3"/>
    <rect x="172" y="394" width="120" height="12" rx="6" fill="#4cc2ff"/>
    <rect x="172" y="416" width="168" height="10" rx="5" fill="#5a6b78"/>
    <rect x="172" y="434" width="96"  height="10" rx="5" fill="#5a6b78"/>
  </g>
</svg>
