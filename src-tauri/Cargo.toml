[package]
name = "signal-whatsapp-hub"
version = "0.2.0"
description = "Unified Signal + WhatsApp desktop hub (Tauri 2, all-Rust)"
authors = ["Signal WhatsApp Hub contributors"]
license = "MIT"
edition = "2021"

[lib]
name = "swhub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
qrcode = "0.14"
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
# Tiny blocking HTTP server for the integration API (no async runtime needed).
tiny_http = "0.12"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
